name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JSON manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json > /dev/null
      - name: Skill frontmatter
        run: |
          head -1 skills/harden-plan/SKILL.md | grep -qx -- '---'
          grep -q '^name: harden-plan$' skills/harden-plan/SKILL.md
      - name: Referenced files exist
        run: |
          test -f skills/harden-plan/references/checklist.md
          test -f skills/harden-plan/references/critic-prompt.md
          test -f skills/harden-plan/scripts/lint_plan.py
          test -f agents/plan-critic.md
          grep -q '^name: plan-critic$' agents/plan-critic.md
      - name: "Plan linter: good fixture passes, bad fixture fails"
        run: |
          python3 skills/harden-plan/scripts/lint_plan.py tests/fixtures/good-plan.md
          ! python3 skills/harden-plan/scripts/lint_plan.py tests/fixtures/bad-plan.md
